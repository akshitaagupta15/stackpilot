name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stackpilot
          POSTGRES_PASSWORD: stackpilot
          POSTGRES_DB: stackpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stackpilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stackpilot:stackpilot@localhost:5432/stackpilot
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build -t stackpilot-backend .
      - name: Smoke test the container
        run: |
          docker run -d --name sp -p 8000:8000 -e DEMO_MODE=1 -e ADMIN_TOKEN=ci-token stackpilot-backend
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs http://localhost:8000/ready
          docker logs sp
          docker rm -f sp
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
